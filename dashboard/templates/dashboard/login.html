<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - مرصاد</title>
    <style>
        body { background-color: #f6f5fa; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; background: #111b27; color: white; padding: 12px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>مرصاد</h2>
        <p style="color: #666; font-size: 12px; margin-bottom: 20px;">نظام سلامة ذكي للمواقع</p>
        <input type="email" placeholder="البريد الإلكتروني">
        <input type="password" placeholder="كلمة المرور">
        <a href="{% url 'home' %}"><button class="btn">تسجيل الدخول</button></a>
    </div>
</body>
</html>
