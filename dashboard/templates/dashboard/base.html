<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصاد - نظام سلامة ذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f6f5fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 410px; height: 840px; background-color: #fbfbfe; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 8px solid #111b27; position: relative; }
        .app-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #f1f5f9; }
        .app-header h1 { font-size: 18px; color: #111b27; text-align: center; flex-grow: 1; }
        .app-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: #ffffff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #f1f5f9; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #111b27; font-weight: bold; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #f1f5f9; margin-bottom: 12px; }
        .btn-main { width: 100%; background: #111b27; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        {% block content %}{% endblock %}
        <div class="bottom-nav">
            <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
            <a href="{% url 'events' %}" class="nav-item {% if request.resolver_match.url_name == 'events' %}active{% endif %}"><i class="fa-regular fa-clipboard"></i><span>الأحداث</span></a>
            <a href="{% url 'live_stream' %}" class="nav-item {% if request.resolver_match.url_name == 'live_stream' %}active{% endif %}"><i class="fa-solid fa-video"></i><span>البث</span></a>
            <a href="{% url 'stats' %}" class="nav-item {% if request.resolver_match.url_name == 'stats' %}active{% endif %}"><i class="fa-solid fa-chart-column"></i><span>الإحصائيات</span></a>
            <a href="{% url 'settings' %}" class="nav-item {% if request.resolver_match.url_name == 'settings' %}active{% endif %}"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
        </div>
    </div>

<!-- شريط التنقل السفلي -->
        <div class="bottom-nav">
            <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="{% url 'stats' %}" class="nav-item {% if request.resolver_match.url_name == 'stats' %}active{% endif %}">
                <i class="fa-solid fa-chart-column"></i>
                <span>الإحصائيات</span>
            </a>
            <a href="{% url 'events' %}" class="nav-item {% if request.resolver_match.url_name == 'events' %}active{% endif %}">
                <i class="fa-regular fa-clipboard"></i>
                <span>الأحداث</span>
            </a>
            <a href="{% url 'settings' %}" class="nav-item {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </a>
        </div>


</body>
</html>
